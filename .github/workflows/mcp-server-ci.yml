name: MCP Server CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  mcp_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync (mcp_server)
        run: uv sync --directory mcp_server

      - name: Lint (mcp_server)
        run: uv run --directory mcp_server ruff check . --output-format=github

      - name: Format check (mcp_server)
        run: uv run --directory mcp_server ruff format --check .

      - name: Test (mcp_server)
        run: uv run --directory mcp_server pytest tests/

  # Docker 构建验证（mcp_server 独立项目，context 为 ./mcp_server）
  mcp_docker_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp_server
          file: ./mcp_server/Dockerfile
          push: false
          tags: bangumi-syncer-mcp:test
